spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/earlysignal}
spring.datasource.username=${DATABASE_USER:earlysignal}
spring.datasource.password=${DATABASE_PASSWORD:earlysignal}
spring.sql.init.mode=always
server.port=${PORT:8080}

# Game settings
game.starting-cash=10000
game.fee-rate=0.01
game.max-position-pct=0.30
game.max-daily-move=0.25
game.history-days=30
# Set to false before the demo if you only want the Advance Day button to move prices
game.daily-update-enabled=true
