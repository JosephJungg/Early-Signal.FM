spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/earlysignal}
spring.datasource.username=${DATABASE_USER:earlysignal}
spring.datasource.password=${DATABASE_PASSWORD:earlysignal}
spring.sql.init.mode=always
server.port=${PORT:8080}

# Game settings
game.starting-cash=10000
game.fee-rate=0.01
game.max-position-pct=0.30
game.max-daily-move=0.45
game.history-days=30
# Off by default so only the Advance Day button moves prices (no surprise jump at midnight during the demo).
# Set DAILY_UPDATE_ENABLED=true to also advance one day at midnight Pacific.
game.daily-update-enabled=${DAILY_UPDATE_ENABLED:false}
